name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Native registry to publish
        required: true
        type: choice
        options:
          - npm
          - pypi
          - nuget
          - maven-central
      nuget_user:
        description: nuget.org profile username (required only for NuGet)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-publish-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  npm:
    if: inputs.registry == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate release source
        run: bash scripts/generate.sh
      - name: Require OIDC-capable npm
        run: |
          npm install --global npm@latest
          npm --version
      - name: Publish npm alpha
        run: npm publish generated/typescript --access public --provenance --tag next

  pypi:
    if: inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate release source
        run: bash scripts/generate.sh
      - name: Build Python distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build generated/python --outdir dist/pypi
      - name: Publish PyPI alpha
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/

  nuget:
    if: inputs.registry == 'nuget'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Generate release source
        run: bash scripts/generate.sh
      - name: Build NuGet package
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find generated/dotnet -path '*/src/SportsFoundry/SportsFoundry.csproj' -print -quit)"
          test -n "$csproj"
          dotnet pack "$csproj" -c Release -o dist/nuget
      - name: Require NuGet profile username
        shell: bash
        env:
          NUGET_USER: ${{ inputs.nuget_user }}
        run: |
          test -n "$NUGET_USER" || { echo "::error::nuget_user workflow input is required for NuGet publishing"; exit 1; }
      - name: Exchange GitHub OIDC token for NuGet API key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ inputs.nuget_user }}
      - name: Publish NuGet alpha
        shell: bash
        run: dotnet nuget push dist/nuget/SportsFoundry.0.1.0-alpha.1.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  maven-central:
    if: inputs.registry == 'maven-central'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate release source
        run: bash scripts/generate.sh
      - name: Import Maven Central signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Configure Central user-token credentials
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_TOKEN_USERNAME}</username>
                <password>${CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Sign and publish Maven Central alpha
        shell: bash
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mvn -B -f generated/java/pom.xml -Psign-artifacts deploy
