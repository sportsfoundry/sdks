name: SDK release candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Generate clients
        run: bash scripts/generate.sh

      - name: Verify coordinates and customer boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "@sportsfoundryapp/sdk"' generated/typescript/package.json
          grep -q 'name = "sportsfoundry"' generated/python/pyproject.toml || grep -q 'name="sportsfoundry"' generated/python/setup.py
          grep -q '<groupId>app.sportsfoundry</groupId>' generated/java/pom.xml
          grep -q '<artifactId>sportsfoundry-java</artifactId>' generated/java/pom.xml
          find generated/dotnet -name '*.csproj' -print -quit | grep -q .
          ! grep -R --line-number '/api/v1/operations/' openapi/public-v1.json
          ! grep -R --line-number '/api/v1/provenance/' openapi/public-v1.json

      - name: Build npm package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/npm
          (cd generated/typescript && npm pack --pack-destination ../../dist/npm)

      - name: Build Python package
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build generated/python --outdir dist/pypi

      - name: Build Java package
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f generated/java/pom.xml -DskipTests package
          mkdir -p dist/maven
          find generated/java/target -maxdepth 1 -type f \( -name '*.jar' -o -name '*.pom' \) -exec cp {} dist/maven/ \;

      - name: Build NuGet package
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(find generated/dotnet -name '*.csproj' -print -quit)"
          test -n "$csproj"
          dotnet pack "$csproj" -c Release -o dist/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: sportsfoundry-sdk-0.1.0-alpha.1
          path: dist/
          if-no-files-found: error
          retention-days: 14
